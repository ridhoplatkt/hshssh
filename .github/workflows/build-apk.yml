name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kalau project di-upload sebagai soundwave.zip, ekstrak otomatis
      - name: Extract project zip
        run: |
          if [ -f soundwave.zip ]; then unzip -oq soundwave.zip; fi
          if [ ! -f app/build.gradle.kts ]; then
            echo "::error::Project belum ada di repo. Upload soundwave.zip ke root repo."
            exit 1
          fi

      # debug.keystore tidak ada di repo, jadi pakai debug keystore bawaan Android
      - name: Fix debug signing
        run: sed -i 's/debug { signingConfig = signingConfigs.getByName("debugConfig") }/debug { }/' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SoundWave-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
